name: CI

# Pull requests run once (not again for the branch push) and test on macOS 26
# only, so small pushes stay quick. Pushes to main and a weekly run also test on
# macOS 15, the minimum; the deployment target already makes the compiler reject
# newer APIs on every build. The release rehearsal builds on macOS 15 every time,
# alongside the tests: that's what a release builds on.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: catches runner image changes too
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    # macOS 15 is the oldest supported system (and the oldest GitHub offers).
    # Homebrew's libraries there target 15, so the app and tests really run on it.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["macos-26"]') || fromJSON('["macos-15", "macos-26"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      # Third-party actions are pinned to commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # macos-15's default Xcode is older than the one the code needs; use its
      # newest release Xcode (no betas or release candidates).
      - name: Select Xcode
        if: matrix.os == 'macos-15'
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -1)"

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Native libraries (Homebrew)
        run: brew install taglib rubberband libsamplerate lame mpg123

      - name: Cache ONNX Runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/onnxruntime/lib/libonnxruntime.1.dylib
          key: onnxruntime-${{ hashFiles('scripts/fetch-vendor.sh') }}

      - name: Fetch and verify vendored binaries
        run: scripts/fetch-vendor.sh

      - name: Build the app
        run: swift build --product Pregame

      - name: Build the tests
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  signed-app:
    name: Signed app keeps its identity
    # build-app.sh signs with one self-signed identity, so a rebuilt app keeps the
    # folder access macOS granted the last one (docs/signing.md). Build twice with
    # a throwaway identity and check the second build satisfies the first's
    # designated requirement, which is what macOS checks.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Native libraries (Homebrew)
        run: brew install taglib rubberband libsamplerate lame mpg123

      - name: Cache ONNX Runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor/onnxruntime/lib/libonnxruntime.1.dylib
          key: onnxruntime-${{ hashFiles('scripts/fetch-vendor.sh') }}

      - name: Fetch and verify vendored binaries
        run: scripts/fetch-vendor.sh

      - name: Throwaway signing identity
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          PREGAME_KEYCHAIN="$KEYCHAIN" PREGAME_SIGNING_PASSPHRASE="$PASS" \
            scripts/make-signing-identity.sh "$RUNNER_TEMP/backup.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" > /dev/null

      - name: Build twice
        run: |
          for build in first second; do
            scripts/build-app.sh
            codesign --display --requirements - build/Pregame.app 2>/dev/null | sed -n 's/^designated => //p' > "$RUNNER_TEMP/$build"
          done

      - name: Same designated requirement, hardened runtime
        run: |
          cat "$RUNNER_TEMP/first"
          grep -q 'certificate leaf' "$RUNNER_TEMP/first"
          diff "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
          codesign --verify --strict -R="$(cat "$RUNNER_TEMP/first")" build/Pregame.app
          for code in build/Pregame.app build/Pregame.app/Contents/Frameworks/*.dylib; do
            codesign --display --verbose "$code" 2>&1 | grep -Eq 'flags=0x[0-9a-f]+\([^)]*runtime' || { echo "$code: no hardened runtime"; exit 1; }
          done

      - name: Sandboxed (ADR-0003)
        run: |
          ENTITLEMENTS="$(codesign --display --entitlements - --xml build/Pregame.app 2>/dev/null | tr -d '\n\t ')"
          [[ "$ENTITLEMENTS" == *'<key>com.apple.security.app-sandbox</key><true/>'* ]] \
            || { echo "build/Pregame.app is not sandboxed"; exit 1; }

      - name: Sparkle embedded for updates (docs/updates.md)
        run: |
          APP=build/Pregame.app
          B="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          # Signed inside out with the app's identity and the hardened runtime,
          # so an update satisfies the installed app's designated requirement.
          for code in "$B/XPCServices/Installer.xpc" "$B/XPCServices/Downloader.xpc" "$B/Autoupdate" "$B/Updater.app" "$APP/Contents/Frameworks/Sparkle.framework" "$APP/Contents/Frameworks/SentryWithoutUIKit.framework"; do
            codesign --verify --strict "$code"
            INFO="$(codesign --display --verbose=2 "$code" 2>&1)"
            [[ "$INFO" == *'Authority=Pregame Self-Signed'* ]] || { echo "$code: not signed with the app's identity"; exit 1; }
            [[ "$INFO" =~ flags=0x[0-9a-f]+\([^\)]*runtime ]] || { echo "$code: no hardened runtime"; exit 1; }
          done
          # Sparkle downloads in its own XPC service.
          DOWNLOADER="$(codesign --display --entitlements - --xml "$B/XPCServices/Downloader.xpc" 2>/dev/null | tr -d '\n\t ')"
          [[ "$DOWNLOADER" == *'<key>com.apple.security.network.client</key><true/>'* ]] || { echo "the Downloader can't reach the network"; exit 1; }
          ENTITLEMENTS="$(codesign --display --entitlements - --xml "$APP" 2>/dev/null)"
          # The app's own outgoing connections are only for opt-in crash reports
          # and usage data (docs/privacy.md), sent by Sentry's embedded framework.
          [[ "$ENTITLEMENTS" == *network.client* ]] || { echo "the app can't send crash reports or usage data"; exit 1; }
          # The app loads its embedded Sparkle, not the build folder's.
          RPATHS="$(otool -l "$APP/Contents/MacOS/Pregame" | awk '/LC_RPATH/ {getline; getline; print $2}')"
          [[ "$RPATHS" != *"$PWD/.build/"* ]] || { echo "rpath into the build folder: $RPATHS"; exit 1; }
          # Sparkle can only lift an update's quarantine flag from files it can write.
          UNWRITABLE="$(find "$APP" ! -perm -u+w)"
          [[ -z "$UNWRITABLE" ]] || { echo "not user-writable: $UNWRITABLE"; exit 1; }

  release-rehearsal:
    name: Release rehearsal (macos-15)
    # Runs scripts/release.sh as .github/workflows/release.yml does, on the same
    # macOS, but with a throwaway certificate and update key and without
    # publishing, so a broken release shows up before a tag does. Only
    # release.yml can read the real keys (docs/releasing.md).
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -1)"

      # TagLib is built from pinned source by scripts/release.sh, not from Homebrew.
      - name: Native libraries (Homebrew)
        run: brew install rubberband libsamplerate lame mpg123

      # Restored files are verified against their checksums all the same.
      - name: Cache ONNX Runtime and the Demucs weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Vendor/onnxruntime/lib/libonnxruntime.1.dylib
            Models/htdemucs.onnx.data
          key: vendor-model-${{ hashFiles('scripts/fetch-vendor.sh') }}

      - name: Throwaway signing identity and update key
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          PREGAME_KEYCHAIN="$KEYCHAIN" PREGAME_SIGNING_PASSPHRASE="$PASS" \
            scripts/make-signing-identity.sh "$RUNNER_TEMP/backup.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" > /dev/null
          # Sparkle's key file holds a base64 Ed25519 seed: any 32 random bytes.
          openssl rand -base64 32 > "$RUNNER_TEMP/update-key.txt"
          # The rehearsal's app trusts that key, as the real app trusts the real one.
          cat > "$RUNNER_TEMP/public-key.swift" <<'SWIFT'
          import CryptoKit
          import Foundation
          let seed = Data(base64Encoded: readLine()!.trimmingCharacters(in: .whitespaces))!
          print(try! Curve25519.Signing.PrivateKey(rawRepresentation: seed).publicKey.rawRepresentation.base64EncodedString())
          SWIFT
          PUBLIC_KEY="$(swift "$RUNNER_TEMP/public-key.swift" < "$RUNNER_TEMP/update-key.txt")"
          /usr/libexec/PlistBuddy -c "Set :SUPublicEDKey $PUBLIC_KEY" scripts/Info.plist

      - name: Build, check and package
        run: |
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' scripts/Info.plist)"
          scripts/release.sh "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sign the appcast
        run: |
          PREGAME_SPARKLE_KEY_FILE=- scripts/make-appcast.sh "build/release/Pregame-$VERSION.dmg" build/release < "$RUNNER_TEMP/update-key.txt"

      - name: The DMG installs an app that launches on macOS 15
        run: |
          DMG="build/release/Pregame-$VERSION.dmg"
          MOUNT="$RUNNER_TEMP/dmg"
          mkdir "$MOUNT"
          hdiutil attach -quiet -nobrowse -readonly -mountpoint "$MOUNT" "$DMG"
          [[ "$(readlink "$MOUNT/Applications")" == /Applications ]] || { echo "no Applications link in the DMG"; exit 1; }
          ditto "$MOUNT/Pregame.app" "$RUNNER_TEMP/Pregame.app"
          hdiutil detach -quiet "$MOUNT"
          APP="$RUNNER_TEMP/Pregame.app"
          codesign --verify --strict --deep "$APP"
          [[ -f "$APP/Contents/Resources/Models/htdemucs.onnx.data" ]] || { echo "the Demucs model isn't bundled"; exit 1; }
          scripts/check-min-macos.sh "$APP"
          # dyld refuses a library built for a newer macOS at launch, so launch it.
          "$APP/Contents/MacOS/Pregame" > "$RUNNER_TEMP/launch.log" 2>&1 &
          PID=$!
          sleep 20
          if ! kill -0 "$PID" 2>/dev/null; then
            cat "$RUNNER_TEMP/launch.log"
            echo "Pregame quit at launch"
            exit 1
          fi
          kill "$PID"

      # make-appcast.sh already checked the DMG's signature against the app's key.
      - name: The appcast is signed and points at the release
        run: |
          APPCAST=build/release/appcast.xml
          .build/artifacts/sparkle/Sparkle/bin/sign_update --verify --ed-key-file "$RUNNER_TEMP/update-key.txt" "$APPCAST"
          URL="$(xmllint --xpath 'string(//item/enclosure/@url)' "$APPCAST")"
          [[ "$URL" == "https://github.com/Praful-Joshi/pregame/releases/download/v$VERSION/Pregame-$VERSION.dmg" ]] \
            || { echo "the appcast points at $URL"; exit 1; }
