name: Release

# Pushing a version tag (v0.2) builds, signs and packages the DMG, signs the
# appcast, and publishes both to a GitHub Release (docs/releasing.md). The job
# waits for the maintainer to approve the protected `release` environment,
# which alone holds the signing certificate and the update key. Pull requests
# never run this; CI rehearses it with throwaway keys (release-rehearsal).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    # Homebrew's libraries target the macOS they're built on, so the release
    # builds on the minimum, macOS 15 (scripts/check-min-macos.sh checks).
    runs-on: macos-15
    environment: release
    timeout-minutes: 45
    permissions:
      contents: write       # create the release
      id-token: write       # sign the provenance attestation
      attestations: write   # store it
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
      TAG: ${{ github.ref_name }}
    steps:
      # Third-party actions are pinned to commit SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # to check the tag is on main

      # A secret that isn't set reads as empty; say which one, not a confusing failure later.
      - name: The release environment has its secrets
        env:
          P12: ${{ secrets.PREGAME_SIGNING_P12 }}
          P12_PASSPHRASE: ${{ secrets.PREGAME_SIGNING_P12_PASSPHRASE }}
          SPARKLE_KEY: ${{ secrets.PREGAME_SPARKLE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          MISSING=()
          [[ -n "$P12" ]] || MISSING+=(PREGAME_SIGNING_P12)
          [[ -n "$P12_PASSPHRASE" ]] || MISSING+=(PREGAME_SIGNING_P12_PASSPHRASE)
          [[ -n "$SPARKLE_KEY" ]] || MISSING+=(PREGAME_SPARKLE_KEY)
          [[ -n "$SENTRY_AUTH_TOKEN" ]] || MISSING+=(SENTRY_AUTH_TOKEN)
          (( ${#MISSING[@]} == 0 )) || { echo "::error::Add ${MISSING[*]} to the release environment (docs/releasing.md)"; exit 1; }

      # Only what's merged (and so tested) is released, and Sparkle offers an
      # update only if its CFBundleVersion is higher than the installed one's.
      - name: The tag is on main and the build number went up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG isn't on main; tag a commit that is merged"; exit 1; }
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' scripts/Info.plist)"
          if gh release view --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --output "$RUNNER_TEMP/latest-appcast.xml"
            LATEST="$(xmllint --xpath 'string(//item/*[local-name()="version"])' "$RUNNER_TEMP/latest-appcast.xml")"
            (( BUILD > LATEST )) || { echo "::error::CFBundleVersion $BUILD isn't higher than the latest release's $LATEST"; exit 1; }
          fi

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9.]+\.app$' | sort -V | tail -1)"

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version

      # TagLib is built from pinned source by scripts/release.sh, not from Homebrew.
      - name: Native libraries (Homebrew)
        run: brew install rubberband libsamplerate lame mpg123

      - name: Signing identity
        env:
          P12: ${{ secrets.PREGAME_SIGNING_P12 }}
          P12_PASSPHRASE: ${{ secrets.PREGAME_SIGNING_P12_PASSPHRASE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          PASS="$(openssl rand -hex 16)"
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSPHRASE" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build, check and package
        run: scripts/release.sh "$TAG"

      # Crash reports name Pregame's own functions only if Sentry has this
      # build's debug symbols (docs/privacy.md). The Sentry CLI is pinned to a
      # version and its checksum; the token is an org token that can only
      # upload (docs/releasing.md).
      - name: Upload debug symbols to Sentry
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: pregame-inc
          SENTRY_PROJECT: pregame
          SENTRY_CLI_NO_TELEMETRY: "1"
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sentry.gz" \
            https://github.com/getsentry/toolkit/releases/download/cli@0.50.0/sentry-darwin-arm64.gz
          echo "0b0e857366a5676c452ad93c57e3d86dff828e3189f24c65caf3d89517312692  sentry.gz" \
            | (cd "$RUNNER_TEMP" && shasum -a 256 -c -)
          gunzip -c "$RUNNER_TEMP/sentry.gz" > "$RUNNER_TEMP/sentry"
          chmod +x "$RUNNER_TEMP/sentry"
          "$RUNNER_TEMP/sentry" debug-files upload --wait build/Pregame.dSYM

      # For the one bridge release that rotates the update key, the
      # environment variable PREGAME_INSTALLED_PUBLIC_KEY names the old key
      # (docs/releasing.md); otherwise it's unset.
      - name: Sign the appcast
        env:
          SPARKLE_KEY: ${{ secrets.PREGAME_SPARKLE_KEY }}
          PREGAME_INSTALLED_PUBLIC_KEY: ${{ vars.PREGAME_INSTALLED_PUBLIC_KEY }}
        run: |
          VERSION="${TAG#v}"
          printf '%s' "$SPARKLE_KEY" | PREGAME_SPARKLE_KEY_FILE=- scripts/make-appcast.sh "build/release/Pregame-$VERSION.dmg" build/release
          echo "DMG=build/release/Pregame-$VERSION.dmg" >> "$GITHUB_ENV"
          echo "APPCAST=build/release/appcast.xml" >> "$GITHUB_ENV"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ env.DMG }}
            ${{ env.APPCAST }}

      # The app reads releases/latest/download/appcast.xml, so this release
      # becomes the latest, carrying its appcast (docs/updates.md).
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "$DMG" "$APPCAST" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Pregame ${TAG#v}" \
            --generate-notes \
            --latest

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
